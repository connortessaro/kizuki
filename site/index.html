<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kizuki — the noticing</title>
<meta name="description" content="Kizuki is a personal org-intelligence agent. It watches your working signal and surfaces what you missed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#14140F; --paper:#EDEBE3; --stone:#8A887E; --seal:#C8402E;
    --display:"Shippori Mincho",serif; --body:"Inter",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--sumi);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px}
  main{max-width:520px}
  :focus-visible{outline:2px solid var(--seal);outline-offset:3px}

  .kanji{font-family:var(--display);font-weight:500;font-size:clamp(56px,12vw,88px);line-height:1.1;letter-spacing:.04em}
  h1{font-family:var(--display);font-weight:600;font-size:26px;margin-top:20px;letter-spacing:.02em}
  h1 span{color:var(--stone);font-weight:500;font-family:var(--body);font-size:16px;margin-left:10px;letter-spacing:0}
  p{margin-top:18px;color:var(--stone)}
  .notice{color:var(--paper);position:relative;white-space:nowrap}
  .notice::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:var(--seal);transform:scaleX(0);transform-origin:left;animation:draw .6s ease-out 1.2s forwards}
  @keyframes draw{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.notice::after{animation:none;transform:scaleX(1)}}

  .status{margin-top:32px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--stone)}
  .status a{color:var(--paper);text-decoration:underline;text-underline-offset:3px}
  .status a:hover{color:var(--seal)}
</style>
</head>
<body>
<main>
  <div class="kanji" aria-hidden="true">気づき</div>
  <h1>Kizuki<span>the noticing</span></h1>
  <p>A personal agent that reads your working signal — meetings, threads, tickets — and surfaces <span class="notice">what you missed</span>: the silent scope cut, the duplicated work, the follow-up going stale. It watches; you decide.</p>
  <p class="status">IN QUIET DEVELOPMENT · <a href="mailto:tessaro.c@northeastern.edu?subject=Kizuki">SAY HELLO</a></p>
</main>
</body>
</html>
