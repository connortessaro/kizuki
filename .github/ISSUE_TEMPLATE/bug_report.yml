name: Bug report
description: Something in Kizuki behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real vault content — redact
        names, transcripts and anything work-specific before submitting.

        Found a security problem? Do not file it here. See
        [SECURITY.md](https://github.com/connortessaro/kizuki/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran.
      placeholder: |
        1. export KIZUKI_VAULT=/tmp/scratch
        2. ./kizuki init --agent claude
        3. ./kizuki sync --dry-run
        4. ...
      render: shell
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - CLI (kizuki ...)
        - MCP server (kizuki mcp)
        - Local daemon / HTTP API
        - Web dashboard (web/)
        - Skills export
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kizuki version or commit
      placeholder: "0.1.0, or the commit SHA you are running"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: "macOS 15.5, Node 22.11.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: kizuki doctor output
      description: Output of `kizuki doctor --no-smoke`. Redact any paths you would rather not share.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed real names, transcripts and other vault content from this report.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
