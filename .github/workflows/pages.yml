name: Pages

# Publishes the code docs (TypeDoc, with the guides) to
# GitHub Pages on each push to main: https://connortessaro.github.io/kizuki/.
# `pnpm docs:site` builds the same site locally into docs/api/.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default. Each job re-grants only what it needs.
permissions: {}

# One deploy at a time. A newer push waits for the running deploy instead of
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm docs:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
