name: Pages

# Publishes the code docs (TypeDoc, with the guides and the HTTP reference) to
# GitHub Pages on each push to main: https://connortessaro.github.io/kizuki/.
# `npm run docs:site` builds the same site locally into docs/api/.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default. Each job re-grants only what it needs.
permissions: {}

# One deploy at a time. A newer push waits for the running deploy instead of
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site from the committed docs/openapi.json
        run: npm run docs:site
      # typedoc.json links to /docs/http-api/, where kizuki.dev serves it.
      # Pages serves this site under /kizuki/ instead.
      - name: Point the links at the Pages address
        run: |
          grep -rl 'href="/docs/http-api/"' docs/api | xargs sed -i 's|href="/docs/http-api/"|href="/kizuki/http-api/"|g'
          cp public/seal-ki.svg docs/api/seal-ki.svg
          sed -i 's|href="/seal-ki.svg"|href="../seal-ki.svg"|' docs/api/http-api/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
