name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Also publish to npm (needs a trusted publisher on npmjs.com)"
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$pkg" ]; then
            echo "::error::tag $TAG_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "tag $TAG_NAME matches package.json"

  release:
    name: github release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A signed record that this tarball was built by this workflow from this tag.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache here either: this job builds the tarball that
          # gets signed and attached to the release.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Pack the tarball (builds the app first)
        id: pack
        # npm, not pnpm, packs and publishes, so the tarball lists its
        # dependencies the way npm installs them for `npx kizuki`.
        run: |
          file=$(npm pack --silent | tail -n 1)
          cp "$file" kizuki.tgz
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "packed $file ($(du -h "$file" | cut -f1))"
      - name: Attest the tarball (check with `gh attestation verify kizuki.tgz --repo connortessaro/kizuki`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.file }}
            kizuki.tgz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$TAG_NAME" "$ASSET" kizuki.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag \
            --notes-file - <<NOTES
          Run this release in a terminal, with Node.js 22.18 or newer and Ollama:

          \`\`\`bash
          npx kizuki
          \`\`\`

          Or this exact tarball: \`npx https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$ASSET\`
          (check it with \`gh attestation verify $ASSET --repo $GITHUB_REPOSITORY\`).

          Or always the latest: \`npx https://github.com/$GITHUB_REPOSITORY/releases/latest/download/kizuki.tgz\`
          NOTES

  publish-npm:
    name: publish to npm
    needs: verify
    # Opt-in: run this workflow by hand on the release tag with publish_npm ticked.
    # npm trusts this workflow file and the "release" environment (trusted
    # publishing, no token), and the environment waits for the maintainer's
    # approval. It never blocks the GitHub release.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # npm trusted publishing (OIDC). No long-lived token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache in the job that can publish: a poisoned cache
          # entry would run here with the right to publish.
          package-manager-cache: false
          # No registry-url: it writes an .npmrc whose token line reads an unset
          # NODE_AUTH_TOKEN, and npm then skips trusted publishing and gets a 404.
      - name: Use an npm that supports trusted publishing
        # Pinned: an unpinned "latest" would run whatever npm publishes next, in the job that can publish.
        run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      # npm publishes, as it packs in the release job: same tarball rules, and npm
      # handles trusted publishing.
      - run: npm publish --loglevel verbose
