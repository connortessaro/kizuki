name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny by default. Each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  checks:
    name: lint, types, docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Docs are complete and docs/openapi.json matches the code
        run: pnpm docs:check
      - name: No known high or critical holes in what the app ships
        run: pnpm audit --prod --audit-level high

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24"]
        include:
          - os: macos-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage (fails below the minimum in vitest.config.ts)
        run: pnpm coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Study loop in a browser, with a fake model server
        run: pnpm e2e
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pii:
    name: no personal identifiers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-pii.mjs

  package:
    name: package contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (the version in package.json)
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The npm package holds the app and no private data
        # npm packs the release (see release.yml), so npm checks it here.
        run: |
          npm pack --dry-run 2>&1 | sed 's/^npm notice //' > /tmp/pack.txt
          if grep -qE '\.kizuki/|people/|transcripts/|days/|signals/|insights/|catches/|alerts/|events/|activity/|state/|backlog/|\.claude/|kizuki\.config\.json|\.next/cache/|evals/' /tmp/pack.txt; then
            echo "::error::a private or unneeded path is in the npm package"
            grep -E '\.kizuki/|people/|transcripts/|days/|signals/|insights/|catches/|alerts/|events/|activity/|state/|backlog/|\.claude/|kizuki\.config\.json|\.next/cache/|evals/' /tmp/pack.txt
            exit 1
          fi
          if grep -qE '\.map$' /tmp/pack.txt; then
            echo "::error::source maps are in the npm package"
            grep -E '\.map$' /tmp/pack.txt | head
            exit 1
          fi
          for needed in bin/kizuki.mjs .next/BUILD_ID LICENSE NOTICE; do
            grep -q "$needed" /tmp/pack.txt || { echo "::error::$needed is missing from the npm package"; exit 1; }
          done
          echo "package contents look right"

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: high
          # No fixed version exists. It only arrives through @workflow/nest >
          # @swc/cli, which Kizuki never runs. Matches pnpm-workspace.yaml.
          allow-ghsas: GHSA-ch52-4w7c-c8xp
          # Keep the dependency tree permissive-only, matching NOTICE.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          # sharp's prebuilt libvips binaries (used by Next.js for images) are
          # LGPL-3.0-or-later, used unmodified as a dynamically loaded library,
          # which LGPL permits. Everything else stays on the deny-list.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64
