# pnpm settings for this single-package repo. pnpm reads its settings from this
# file, not from package.json or .npmrc.

# Packages allowed to run install scripts. pnpm blocks all others.
# better-sqlite3 builds or fetches native code, esbuild fetches its binary, and
# vue-demi (used by the evals' report page) sets up files after install.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  vue-demi: true

# Pinned versions for packages deep in the tree, mostly to close known holes.
overrides:
  better-sqlite3: ^13.0.3
  undici: ^7.29.1
  "evalite>@fastify/static": ^10.1.4
  "evalite>file-type": ^22.0.0
