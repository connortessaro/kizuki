[project]
name = "kizuki-analytics"
version = "0.1.0"
description = "Analytical and retrieval plane for Kizuki: DuckDB warehouse, pgvector store, hybrid ask service."
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster>=1.13,<1.14",
    "dagster-duckdb>=0.29",
    "duckdb>=1.5",
    "sqlglot>=30",
    "fastembed>=0.8",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyyaml>=6",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kizuki_analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]

[tool.dagster]
module_name = "kizuki_analytics.defs"
